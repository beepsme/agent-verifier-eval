<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
<text x="10" y="24" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0E1720">The two-regime taxonomy: one label is not enough</text>
<text x="10" y="46" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#4A5A66">columns: did the agent claim success · rows: what the world says</text>
<rect x="20" y="70" width="350" height="120" rx="10" fill="none" stroke="#DCE5E9"/>
<rect x="20" y="70" width="6" height="120" rx="3" fill="#2FA97C"/>
<text x="40" y="104" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#2FA97C">TP</text>
<text x="40" y="132" font-family="Segoe UI,sans-serif" font-size="13" fill="#0E1720">claimed and it truly succeeded</text>
<text x="40" y="156" font-family="Segoe UI,sans-serif" font-size="12" fill="#4A5A66">the good case</text>
<rect x="390" y="70" width="350" height="120" rx="10" fill="none" stroke="#DCE5E9"/>
<rect x="390" y="70" width="6" height="120" rx="3" fill="#C9503F"/>
<text x="410" y="104" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#C9503F">FP · over-confidence</text>
<text x="410" y="132" font-family="Segoe UI,sans-serif" font-size="13" fill="#0E1720">claimed but it failed</text>
<text x="410" y="156" font-family="Segoe UI,sans-serif" font-size="12" fill="#4A5A66">a false &#8220;done!&#8221; · the dangerous failure</text>
<rect x="20" y="206" width="350" height="120" rx="10" fill="none" stroke="#DCE5E9"/>
<rect x="20" y="206" width="6" height="120" rx="3" fill="#D98F2B"/>
<text x="40" y="240" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#D98F2B">FN · over-deferral</text>
<text x="40" y="268" font-family="Segoe UI,sans-serif" font-size="13" fill="#0E1720">refused but it was achievable</text>
<text x="40" y="292" font-family="Segoe UI,sans-serif" font-size="12" fill="#4A5A66">the quiet failure that makes agents useless</text>
<rect x="390" y="206" width="350" height="120" rx="10" fill="none" stroke="#DCE5E9"/>
<rect x="390" y="206" width="6" height="120" rx="3" fill="#00A9BE"/>
<text x="410" y="240" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#00A9BE">TN</text>
<text x="410" y="268" font-family="Segoe UI,sans-serif" font-size="13" fill="#0E1720">refused and it was impossible</text>
<text x="410" y="292" font-family="Segoe UI,sans-serif" font-size="12" fill="#4A5A66">the correct deferral</text>
</svg>