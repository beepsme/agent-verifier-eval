function chips(el,key,cur,set){
  const m=counts(key);
  el.innerHTML=[`<button data-v="all">all ${key==="intended_regime"?"regimes":"skills"}</button>`]
    .concat(Object.keys(m).sort().map(k=>`<button data-v="${k}">${k.replace(/_/g," ")} (${m[k]})</button>`)).join("");
  el.querySelectorAll("button").forEach(b=>{
    if(b.dataset.v===cur)b.classList.add("on");
    b.onclick=()=>{set(b.dataset.v);render()};
  });
}
function render(){
  chips(document.getElementById("fRegime"),"intended_regime",regime,v=>regime=v);
  chips(document.getElementById("fSkill"),"skill",skill,v=>skill=v);
  const rows=TASKS.filter(t=>(regime==="all"||t.intended_regime===regime)&&(skill==="all"||t.skill===skill));
  document.getElementById("count").textContent=rows.length+" of "+TASKS.length+" tasks";
  document.getElementById("list").innerHTML=rows.map(t=>`
   <div class="card">
    <div class="top">
      <span class="pill p-id">${t.task_id}</span>
      <span class="pill p-${t.intended_regime}">${t.intended_regime.replace(/_/g," ")}</span>
      <span class="pill p-diff">${t.skill} · ${t.difficulty}</span>
    </div>
    <div class="goal">&ldquo;${t.goal}&rdquo;</div>
    ${t.precondition?`<div class="pre">setup: ${t.precondition}</div>`:""}
    <div class="oracle"><b>oracle:</b> ${t.oracle}</div>
   </div>`).join("");
}
render();
bars(document.getElementById("cRegime"),"intended_regime",COLORS);
bars(document.getElementById("cSkill"),"skill",null);
bars(document.getElementById("cDiff"),"difficulty",null);
requestAnimationFrame(()=>requestAnimationFrame(()=>
  document.querySelectorAll(".f").forEach(f=>f.style.width=f.dataset.w+"%")));
</script></body></html>
